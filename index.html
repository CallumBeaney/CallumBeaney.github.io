<script>
  console.log('what are you doing back here?');
  fetch('https://api.github.com/repos/CallumBeaney/CallumBeaney.github.io/commits?per_page=1')
    .then(function (r) { return r.json(); })
    .then(function (commits) {
      if (!commits || !commits[0] || !commits[0].commit) return;
      var date = new Date(commits[0].commit.committer.date);
      var y = date.getFullYear();
      var m = String(date.getMonth() + 1).padStart(2, '0');
      var d = String(date.getDate()).padStart(2, '0');
      document.getElementById('lastUpdated').textContent = 'Last updated ' + y + '/' + m + '/' + d;
    })
    .catch(function () { });
</script>
